<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Water Quest</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <h1>Water Quest</h1>
    <p class="game-instructions">Collect 20 cans to win!</p>
    <fieldset class="difficulty-picker">
      <legend>Difficulty</legend>
      <label><input type="radio" name="difficulty" value="easy"><span>Easy</span></label>
      <label><input type="radio" name="difficulty" value="medium" checked><span>Medium</span></label>
      <label><input type="radio" name="difficulty" value="hard"><span>Hard</span></label>
    </fieldset>
    <div class="stats">
      <p>Cans Collected: <span id="current-cans">0</span></p>
      <p>Time Left: <span id="timer">30</span>s</p>
    </div>
    <div id="achievements" class="achievement" role="status" aria-live="polite"></div>
    <div class="game-grid"></div>
    <div class="game-controls">
      <button id="start-game">Start Game</button>
      <button id="reset-game" type="button">Reset</button>
    </div>
    <footer class="site-footer">
      <p>Learn more and help bring clean water to everyone.</p>
      <nav aria-label="charity: water links">
        <a href="https://www.charitywater.org/" target="_blank" rel="noopener noreferrer">Visit charity: water</a>
        <a href="https://www.charitywater.org/donate" target="_blank" rel="noopener noreferrer">Donate</a>
      </nav>
    </footer>
  </div>
  <script src="script.js"></script>
</body>
</html>
